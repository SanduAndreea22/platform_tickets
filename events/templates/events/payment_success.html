{% extends 'base.html' %}
{% block title %}Payment successful - TicketPlatform{% endblock %}
{% block content %}
<section class="result-page">
  <div class="result-icon is-success"><i class="fa-solid fa-check"></i></div>
  <h1>You're in!</h1>
  <p>Payment received. Your reservation is <strong>confirmed</strong> and your tickets are ready in your account.</p>
  <div class="result-actions">
    <a href="{% url 'events:my_tickets' %}" class="btn btn-primary btn-lg"><i class="fa-solid fa-ticket"></i> View my tickets</a>
    <a href="{% url 'events:events_list' %}" class="btn btn-ghost btn-lg">Back to events</a>
  </div>
</section>
{% endblock %}
