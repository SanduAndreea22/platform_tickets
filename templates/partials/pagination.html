{% if page_obj.has_other_pages %}
<nav class="pager" aria-label="Pagination">
  {% if page_obj.has_previous %}<a class="btn btn-ghost btn-sm" href="?page={{ page_obj.previous_page_number }}{{ extra_qs }}"><i class="fa-solid fa-arrow-left"></i> Previous</a>{% else %}<span class="btn btn-ghost btn-sm is-disabled"><i class="fa-solid fa-arrow-left"></i> Previous</span>{% endif %}
  <span class="pager-info">Page <b>{{ page_obj.number }}</b> of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} total</span>
  {% if page_obj.has_next %}<a class="btn btn-ghost btn-sm" href="?page={{ page_obj.next_page_number }}{{ extra_qs }}">Next <i class="fa-solid fa-arrow-right"></i></a>{% else %}<span class="btn btn-ghost btn-sm is-disabled">Next <i class="fa-solid fa-arrow-right"></i></span>{% endif %}
</nav>
{% endif %}
