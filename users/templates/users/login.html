{% extends "auth_base.html" %}
{% block title %}Log in - TicketPlatform{% endblock %}
{% block auth_card %}
  <h1>Welcome back</h1>
  <p class="sub">Log in to manage your tickets or events.</p>

  <form method="POST" class="auth-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next|default_if_none:'' }}">

    <div class="field">
      <label for="username">Username</label>
      <div class="input-icon"><i class="fa-solid fa-user"></i>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus></div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-icon"><i class="fa-solid fa-lock"></i>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="button" class="reveal" onclick="togglePassword()" aria-label="Show password"><i id="eyeIcon" class="fa-solid fa-eye"></i></button></div>
    </div>

    <button type="submit" class="btn btn-primary btn-lg btn-block">Log in</button>
  </form>

  <p class="auth-foot"><a href="{% url 'users:password_reset' %}">Forgot your password?</a></p>
  <p class="auth-foot" style="margin-top:8px">New here? <a href="{% url 'users:register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p>
{% endblock %}
