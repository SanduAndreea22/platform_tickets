{% extends "base.html" %}
{% load static %}

{% block title %}Password reset - TicketPlatform{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}

<section class="auth-section">

  <div class="auth-card">

    <h2 class="auth-title">
      Password reset complete ✅
    </h2>

    <p class="auth-subtitle">
      Your password has been updated. You can now log in with your new password.
    </p>

    <a href="{% url 'users:login' %}" class="btn-primary" style="display:inline-block; text-align:center; text-decoration:none;">
      Log in
    </a>

  </div>

</section>

{% endblock %}
